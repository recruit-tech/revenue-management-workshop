[project]
name = "hotel-revenue-management-workshop"
version = "0.1.0"
description = "Synthetic hotel pricing notebook workshop"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.5.4", "pandas>=3.1.1", "scipy>=1.18.1",
  "matplotlib>=3.11.2", "seaborn>=0.13.2", "PyYAML>=6.0.3",
  "ipykernel>=7.4.0", "nbclient>=0.11.0", "nbformat>=5.11.1",
  "jupyterlab>=4.6.6",
]

[dependency-groups]
audit = ["pip-audit>=2.10.1"]

[tool.uv]
package = false
